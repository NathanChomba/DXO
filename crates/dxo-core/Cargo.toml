[package]
name = "dxo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "dxo_core"
# cdylib  -> dxo_core.dll for the WinUI front end (P/Invoke)
# rlib    -> linked directly by dxo-cli and tests
crate-type = ["cdylib", "rlib"]

[dependencies]
hidapi.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
crc32fast.workspace = true

[target.'cfg(windows)'.dependencies]
# unstable_xtarget_notification: lets us receive rumble games send to the virtual pad
vigem-client = { version = "0.1", features = ["unstable_xtarget_notification", "unstable_ds4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
